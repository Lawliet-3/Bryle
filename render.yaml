services:
  - type: web
    name: bryle-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.scrape
    startCommand: uvicorn bryle.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: WEBSITE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://bryle-gules.vercel.app
      - key: CHROMA_PATH
        value: .chroma
      - key: OPENAI_CHAT_MODEL
        value: gpt-5-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MAX_CRAWL_PAGES
        value: "25"
      - key: TOP_K
        value: "5"
